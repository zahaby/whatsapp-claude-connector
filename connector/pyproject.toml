[project]
name = "whatsapp-family-connector"
version = "0.1.0"
description = "Read-only-by-default MCP connector over lharries/whatsapp-mcp, with token-gated remote mode"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.12,<2",   # FastMCP + Streamable HTTP; mcp 2.x renamed FastMCP
    "requests>=2.32",
    "uvicorn>=0.30",
    "cryptography>=42",   # loopback TLS certificate (tls.py)
    "youtube-transcript-api>=1.2",   # YouTube captions for shared links (media.py)
]

[project.optional-dependencies]
# Local transcription of WhatsApp videos / voice notes (media.py).
# Installed by macos/media-setup.sh or windows\media-setup.ps1.
media = ["faster-whisper>=1.1", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "av>=12", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
