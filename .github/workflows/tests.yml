name: tests
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Shell syntax (stock bash)
        if: runner.os != 'Windows'
        run: for f in macos/*.sh; do /bin/bash -n "$f"; done
      - name: Show bash and sed in use
        if: runner.os != 'Windows'
        run: /bin/bash --version | head -1; (sed --version 2>/dev/null || echo "BSD sed") | head -1

      - name: PowerShell syntax (Windows PowerShell 5.1, as shipped with Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $bad = 0
          foreach ($f in Get-ChildItem windows\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Output "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: pytest
        working-directory: connector
        env:
          # macOS: run the scripts with Apple's /bin/bash 3.2 and BSD sed, as on the user's Mac.
          WA_TEST_BASH: /bin/bash
          # Windows: run the scripts with Windows PowerShell 5.1, as on a stock Windows PC.
          WA_TEST_POWERSHELL: powershell.exe
        run: uv run --group dev pytest -q -rs

  bridge:
    # The bridge is upstream Go code that tests only ever stub. Patch the REAL
    # upstream at the pinned commit exactly as install does, then compile it.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Patch and build (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          UPSTREAM: ${{ runner.temp }}/whatsapp-mcp
        run: |
          source macos/common.sh
          git clone -q https://github.com/lharries/whatsapp-mcp.git "$UPSTREAM"
          git -C "$UPSTREAM" checkout -q "$UPSTREAM_COMMIT"
          macos/patch-bridge.sh
          cd "$UPSTREAM/whatsapp-bridge"
          CGO_ENABLED=1 go build -o whatsapp-bridge .
          go vet .

      - name: WhatsApp accepts this client version (no account is linked)
        if: runner.os == 'Linux'
        env:
          UPSTREAM: ${{ runner.temp }}/whatsapp-mcp
        run: |
          cd "$UPSTREAM/whatsapp-bridge" && mkdir -p store
          (timeout 40 ./whatsapp-bridge > run.log 2>&1 || true)
          grep -v '█' run.log | head -20
          if grep -q "Client outdated" run.log; then echo "::error::WhatsApp rejects this whatsmeow version; bump WHATSMEOW_VERSION"; exit 1; fi
          grep -q "Scan this QR code" run.log || { echo "::error::bridge never reached the QR pairing step"; exit 1; }

      - name: Patch and build (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          UPSTREAM: ${{ runner.temp }}\whatsapp-mcp
        run: |
          . .\windows\common.ps1
          git clone -q https://github.com/lharries/whatsapp-mcp.git $Upstream
          git -C $Upstream checkout -q $UpstreamCommit
          & .\windows\patch-bridge.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gcc --version
          Set-Location $BridgeDir
          $env:CGO_ENABLED = '1'
          go build -o whatsapp-bridge.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
